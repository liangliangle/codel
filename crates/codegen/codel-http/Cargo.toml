[package]
license = "Apache-2.0"
name = "codel-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the codel CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking", "rustls-tls-native-roots"] }
reqwest-middleware = { workspace = true }
# Same 0.23 as reqwest's rustls, so the certificate classifier's downcast resolves.
rustls = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
codel-auth = { workspace = true, features = ["middleware"] }
codel-extra-ca = { workspace = true }
codel-sampler = { path = "../codel-sampler" }
codel-version = { workspace = true }
codel-workspace = { workspace = true }

codel-logging = { workspace = true }
[dev-dependencies]
rcgen = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
