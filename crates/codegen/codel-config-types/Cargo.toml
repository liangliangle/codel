serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
codel-announcements = { workspace = true }
codel-config = { workspace = true }
codel-mcp = { workspace = true }

[features]
default-bazel = []

[lints]
workspace = true
