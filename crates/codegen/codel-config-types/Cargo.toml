[package]
license = "Apache-2.0"
name = "codel-config-types"
version = "0.1.0"
edition.workspace = true
description = "Leaf configuration value types for the codel CLI, extracted from codel-shell for dependency inversion."

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
codel-config = { workspace = true }
codel-sandbox = { path = "../codel-sandbox", default-features = false }

[features]
default-bazel = []

[lints]
workspace = true
