[package]
license = "Apache-2.0"
name = "codel-update"
version = "0.1.220-alpha.4"
edition.workspace = true

[dependencies]
dunce = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
indicatif = { workspace = true }
reqwest = { workspace = true }
codel-extra-ca = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["fs", "process", "io-util", "macros", "time"] }
tracing = { workspace = true }
url = { workspace = true }
codel-dirs = { workspace = true }
codel-cloud-config = { workspace = true }
codel-login = { workspace = true }
codel-shell = { path = "../codel-shell", default-features = false }
codel-logging = { workspace = true }
codel-tools = { workspace = true }
codel-version = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true }
sha2 = { workspace = true }
codel-tty-utils = { workspace = true }
# MinGit archive extraction. Not `workspace = true`: the workspace pin has
# default features on (aes/bzip2/lzma/zstd); MinGit entries are only deflated.
zip = { version = "3", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[features]
default = ["codel-shell/default"]
default-bazel = []

[dev-dependencies]
semver = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "test-util"] }
wiremock = { workspace = true }
