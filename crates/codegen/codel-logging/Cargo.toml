[package]
license = "Apache-2.0"
name = "codel-logging"
version = "0.1.0"
edition.workspace = true
description = "Local logging and diagnostics for Codel: structured file logs plus the (inert) event API surface. No analytics or trace transport is included."
authors = ["Codel"]

[features]
default = []
default-bazel = []
memory-log = []

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2.4"
tracing-chrome = "0.7.2"
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
chrono = { workspace = true }
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
] }
reqwest = { workspace = true }
codel-secrets = { workspace = true }
codel-config = { workspace = true }
codel-extra-ca = { workspace = true }
codel-sampler = { workspace = true }
codel-token-estimation = { workspace = true }
codel-dirs = { workspace = true }
codel-env = { workspace = true }
# Single cross-edge: `events::ToolCallCompleted.outcome` reuses
# `codel_session_events::types::ToolOutcome` so the local event log and
# the product telemetry event share the same enum surface.
codel-session-events = { workspace = true }
# `session_metrics::TraceUploadReason::from_upload_method` matches on the shared
# `UploadMethod` enum (small, dependency-light types crate) so the reason->wire
# mapping lives next to the trace-upload lifecycle events it labels.
codel-file-utils = { path = "../codel-file-utils" }
codel-tty-utils = { workspace = true }
codel-version = { workspace = true }
whoami = { workspace = true }
uuid = { workspace = true, features = ["v5", "v7"] }
obfstr = { workspace = true, optional = true }
mid = "4.0.0"
tokio = { workspace = true, features = ["macros", "sync", "rt", "time"] }
parking_lot = { workspace = true }
codel-auth = { workspace = true }
# Trace-context propagation (W3C traceparent) and shared redaction helpers.
codel-trace-context = { workspace = true }
http = { workspace = true }

[dev-dependencies]
# Pre-main unified-log redirect for this crate's own test binary.
ctor = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
# Sets a symlink's own mtime (std's `set_modified` follows links) for prune tests.
filetime = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
