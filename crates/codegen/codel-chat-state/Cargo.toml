[package]
license = "Apache-2.0"
name = "codel-chat-state"
version = "0.1.0"
edition.workspace = true
description = "Actor-based chat state management for Codel agents"

[features]
default-bazel = []

[dependencies]
indexmap = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
codel-compaction = { path = "../../common/codel-compaction" }
codel-sampling-types = { path = "../codel-sampling-types" }
codel-token-estimation = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
